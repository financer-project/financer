name: CI Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  build-and-lint:
    name: Build, Check & Test / Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install package manager (from package.json)
        run: |
          corepack enable
          corepack install

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Cache Node Modules
        id: cache-node
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/yarn
            ~/.cache/Cypress
          key: deps-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Install Dependencies
        run: yarn install

      - name: Build Project
        run: yarn build

      - name: Run ESLint
        run: yarn lint

      - name: Upload build output
        uses: actions/upload-artifact@v5
        with:
          name: next-build
          path: .next
          include-hidden-files: true

  unit-tests:
    name: Build, Check & Test / Unit Tests
    runs-on: ubuntu-latest
    needs: build-and-lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install package manager (from package.json)
        run: |
          corepack enable
          corepack install

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Cache Node Modules
        id: cache-node
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/yarn
            ~/.cache/Cypress
          key: deps-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Install Dependencies
        run: yarn install

      - name: Generate Prisma Client
        run: yarn db:generate

      - name: Run Unit Tests
        run: yarn test:unit

      - name: Upload unit coverage
        uses: actions/upload-artifact@v5
        with:
          name: unit-coverage
          path: .test/unit/coverage

  component-tests:
    name: Build, Check & Test / Component Tests
    runs-on: ubuntu-latest
    needs: build-and-lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install package manager (from package.json)
        run: |
          corepack enable
          corepack install

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Cache Node Modules
        id: cache-node
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/yarn
            ~/.cache/Cypress
          key: deps-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Install Dependencies
        run: yarn install

      - name: Generate Prisma Client
        run: yarn db:generate

      - name: Run Component Tests
        uses: cypress-io/github-action@v6
        with:
          component: true

      - name: Upload component coverage
        uses: actions/upload-artifact@v5
        with:
          name: component-coverage
          path: .test/component/coverage

  e2e-tests:
    name: Build, Check & Test / E2E Tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: build-and-lint
    strategy:
      fail-fast: false
      # NOTE: shard count here must stay at or below the number of
      # test/cypress/e2e/*.spec.ts files (15 as of this restructure,
      # re-verify at .planning/phases/01-bug-fixes-e2e-baseline/BASELINE.md) -
      # a shard with zero assigned specs fails rather than passing vacuously.
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install package manager (from package.json)
        run: |
          corepack enable
          corepack install

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Cache Node Modules
        id: cache-node
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/yarn
            ~/.cache/Cypress
          key: deps-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Install Dependencies
        run: yarn install

      - name: Generate Prisma Client
        run: yarn db:generate

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      - name: Run E2E Tests
        uses: cypress-io/github-action@v6
        with:
          start: yarn test:start:app
          wait-on: http://localhost:3000/api/health-check
          browser: chrome
        env:
          NODE_ENV: test
          DATABASE_URL: mysql://financer-test:password@localhost:3307/financer-test
          SESSION_SECRET_KEY: test-session-secret-which-is-32-bytes-long
          SPLIT: ${{ strategy.job-total }}
          SPLIT_INDEX: ${{ strategy.job-index }}

      - name: Upload E2E coverage (shard ${{ matrix.shard }})
        uses: actions/upload-artifact@v5
        with:
          name: e2e-coverage-shard-${{ matrix.shard }}
          path: .test/e2e/coverage

      - name: Upload screenshots (shard ${{ matrix.shard }})
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: cypress-screenshots-shard-${{ matrix.shard }}
          path: .test/e2e/screenshots

  merge-coverage-and-sonar:
    name: Build, Check & Test / Merge Coverage & SonarQube
    runs-on: ubuntu-latest
    needs: [unit-tests, component-tests, e2e-tests]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install package manager (from package.json)
        run: |
          corepack enable
          corepack install

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Cache Node Modules
        id: cache-node
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.cache/yarn
            ~/.cache/Cypress
          key: deps-${{ runner.os }}-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Install Dependencies
        run: yarn install

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-coverage*'
          path: .test/

      - name: Merge Coverage
        run: yarn coverage:merge

      - name: SonarQube Scan for PR
        uses: sonarsource/sonarqube-scan-action@v4
        if: github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            --define sonar.pullrequest.key=${{ github.event.pull_request.number }}
            --define sonar.pullrequest.branch=${{ github.head_ref || github.ref_name }}
            --define sonar.pullrequest.base=main

      - name: SonarQube Scan for Main
        uses: sonarsource/sonarqube-scan-action@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            --define sonar.branch.name=main
